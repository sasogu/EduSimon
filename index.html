<!DOCTYPE HTML>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>EduSimon - Aula de Música</title>
	<script src="phaser.min.js"></script>
	<script src="Boot.js"></script>
	<script src="Preloader.js"></script>
	<script src="Game.js"></script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			background: linear-gradient(180deg, #121a24 0%, #0b0f14 100%);
			min-height: 100%;
		}
		#gameContainer {
			width: 100%;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
		}
		canvas {
			display: block;
			position: relative !important;
			left: 0 !important;
			top: 0 !important;
			margin: 0 auto;
			max-width: 100%;
			height: auto;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
			border-radius: 18px;
		}
	</style>
</head>
<body>

<div id="gameContainer"></div>

<script type="text/javascript">

/*  Created by Nambiar for Game Dolphin (gamedolph.in)
    Game - Follow Me - Simple Simon Clone 
*/

window.onload = function() {

	var game = new Phaser.Game(360,600, Phaser.AUTO, 'gameContainer');

	game.state.add('Boot', BasicGame.Boot);
	game.state.add('Preloader', BasicGame.Preloader);
	game.state.add('Game', BasicGame.Game);

	game.state.start('Boot');

};

</script>

</body>
</html>
